  function walletPage(){ const tx=state.transactions.filter(t=>t.studentId===currentUser.id).sort((a,b)=>b.date.localeCompare(a.date)); const earned=tx.filter(t=>t.amount>0).reduce((a,b)=>a+b.amount,0), spent=Math.abs(tx.filter(t=>t.amount<0).reduce((a,b)=>a+b.amount,0)); return `<div class="section-head"><div><div class="eyebrow">Digital sustainability wallet</div><h2>Eco Wallet</h2><p>Verified contributions become points you can use across campus.</p></div><button class="primary" data-page="rewards">Redeem Rewards</button></div><div class="grid grid-3"><div class="card wallet-card"><div class="wallet-kicker">Current Balance</div><div class="wallet-value">${pointsBalance(currentUser.id).toLocaleString('en-IN')}</div><div class="wallet-sub">Eco Points available to spend</div></div><div class="card stat-card"><div class="stat-top">Lifetime earned</div><div class="stat-number">${earned.toLocaleString('en-IN')}</div><div class="stat-foot">From positive Eco transactions</div></div><div class="card stat-card"><div class="stat-top">Redeemed</div><div class="stat-number">${spent.toLocaleString('en-IN')}</div><div class="stat-foot">Used for campus rewards</div></div></div><div class="card" style="margin-top:18px;padding:22px"><h3 style="font:800 17px Manrope;margin:0 0 12px">Eco Points history</h3>${tx.map(t=>`<div class="transaction"><div class="tx-main"><strong>${esc(t.label)}</strong><span>${fmtDate(t.date)}</span></div><div class="${t.amount>0?'positive':'negative'}">${t.amount>0?'+':''}${t.amount.toLocaleString('en-IN')} pts</div></div>`).join('')}</div>`; }
  function rewardsPage(){ const rewards=state.rewards.filter(r=>r.active); return `<div class="section-head"><div><div class="eyebrow">Eco marketplace</div><h2>Rewards</h2><p>Use your verified Eco Points for practical campus benefits.</p></div><div class="points-pill">🌿 ${pointsBalance(currentUser.id).toLocaleString('en-IN')} available</div></div><div class="grid grid-4">${rewards.map(r=>`<div class="card reward"><div class="reward-icon">${r.icon}</div><h3>${esc(r.name)}</h3><p>Redeem your verified Eco Points and receive a digital coupon code.</p><div class="reward-bottom"><span class="cost">${r.cost.toLocaleString('en-IN')} pts</span><button class="primary" data-redeem="${r.id}">Redeem</button></div></div>`).join('')}</div>`; }
  function redeem(id){ const r=state.rewards.find(x=>x.id===id); if(!r)return; const bal=pointsBalance(currentUser.id); if(bal<r.cost){toast(`You need ${r.cost-bal} more Eco Points for this reward.`);return;} const u=state.users.find(x=>x.id===currentUser.id);u.points-=r.cost; const code=`ECO-${Math.random().toString(36).slice(2,7).toUpperCase()}`; state.transactions.push({id:'t'+Date.now(),studentId:currentUser.id,amount:-r.cost,label:`${r.name} Redeemed`,date:new Date().toISOString().slice(0,10),type:'debit'}); state.redemptions.push({id:'red'+Date.now(),studentId:currentUser.id,rewardId:r.id,code,date:new Date().toISOString().slice(0,10)}); save(); showModal(`<div style="text-align:center;padding:18px"><div style="font-size:40px">🎉</div><h3>Reward Redeemed Successfully</h3><p style="color:var(--muted)">Reward: <strong>${esc(r.name)}</strong></p><div style="font:800 28px Manrope;letter-spacing:.08em;margin:20px 0;padding:18px;background:#f3f8f4;border-radius:12px">${code}</div><div style="font-size:12px;color:var(--muted)">Remaining balance: ${u.points.toLocaleString('en-IN')} Eco Points</div><button class="primary" style="margin-top:18px" id="redeemDone">Done</button></div>`);document.getElementById('redeemDone').onclick=()=>{closeModal();render();}; }
  function profilePage(){ return `<div class="section-head"><div><div class="eyebrow">Account</div><h2>My Profile</h2><p>Student identity and sustainability participation snapshot.</p></div></div><div class="grid grid-2"><div class="card profile-card"><div class="profile-row"><div class="big-avatar">${initials(currentUser.name)}</div><div><h3>${esc(currentUser.name)}</h3><p>${esc(currentUser.email)} · ${esc(currentUser.studentId)}</p></div></div><div class="checklist"><div><span>Eco Points balance</span><strong>${pointsBalance(currentUser.id).toLocaleString('en-IN')}</strong></div><div><span>Reports submitted</span><strong>${state.reports.filter(r=>r.studentId===currentUser.id).length}</strong></div><div><span>Verified reports</span><strong>${state.reports.filter(r=>r.studentId===currentUser.id&&r.verified).length}</strong></div><div><span>Member since</span><strong>${fmtDate(currentUser.joined)}</strong></div></div></div><div class="card profile-card"><h3>Participation tips</h3><div class="timeline"><div class="step"><span class="step-dot"></span><div class="step-body"><strong>Photograph the issue clearly</strong><span>Useful photos help maintenance verify faster.</span></div></div><div class="step"><span class="step-dot"></span><div class="step-body"><strong>Use approximate location</strong><span>Location is used to route maintenance and spot recurring areas.</span></div></div><div class="step"><span class="step-dot"></span><div class="step-body"><strong>Only valid reports earn points</strong><span>Rejected, duplicate and unverified tickets do not award Eco Points.</span></div></div></div></div></div>`; }

  function renderAdmin(){ const pages={dashboard:'Maintenance Dashboard',reports:'Reports',map:'Campus Map',analytics:'Analytics', 'rewards-admin':'Rewards Management',users:'Users',settings:'Settings'}; if(currentPage==='dashboard')shell(pages.dashboard,adminDashboard()); else if(currentPage==='reports')shell(pages.reports,adminReportsPage()); else if(currentPage==='map')shell(pages.map,adminMapPage()); else if(currentPage==='analytics')shell(pages.analytics,analyticsPage()); else if(currentPage==='rewards-admin')shell(pages['rewards-admin'],rewardsAdminPage()); else if(currentPage==='users')shell(pages.users,usersPage()); else shell(pages.settings,settingsPage()); }
  function adminDashboard(){ const total=state.reports.length,pending=state.reports.filter(r=>!['Resolved','Rejected','Duplicate'].includes(r.status)).length,inprog=state.reports.filter(r=>r.status==='In Progress').length,res=state.reports.filter(r=>r.status==='Resolved').length; return `<div class="section-head"><div><div class="eyebrow">Operations overview</div><h2>Maintenance Dashboard</h2><p>Review, route and resolve campus resource issues.</p></div><div class="admin-tabs"><span class="tab active">Live queue</span><span class="tab">Today · ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</span></div></div><div class="grid grid-4"><div class="card stat-card"><div class="stat-top">Total Reports</div><div class="stat-number">${total}</div><div class="stat-foot">All student tickets</div></div><div class="card stat-card"><div class="stat-top">Pending</div><div class="stat-number">${pending}</div><div class="stat-foot">Awaiting completion</div></div><div class="card stat-card"><div class="stat-top">In Progress</div><div class="stat-number">${inprog}</div><div class="stat-foot">Currently assigned</div></div><div class="card stat-card"><div class="stat-top">Resolved</div><div class="stat-number">${res}</div><div class="stat-foot">Verified & closed</div></div></div><div class="grid grid-2" style="margin-top:18px"><div class="card table-card"><div style="padding:18px 18px 0"><h3 style="font:800 17px Manrope;margin:0 0 4px">Recent reports</h3><p style="color:var(--muted);font-size:12px;margin:0 0 15px">Latest student-submitted tickets</p></div>${adminTable(state.reports.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6))}</div><div class="card" style="padding:20px"><h3 style="font:800 17px Manrope;margin:0 0 15px">Sustainability pulse</h3><div class="grid grid-2"><div class="insight"><strong>Top category</strong><span>${mostCommon(state.reports.map(r=>r.category))}</span></div><div class="insight"><strong>Hotspot</strong><span>${mostCommon(state.reports.map(r=>r.locationName))}</span></div><div class="insight"><strong>Eco Points distributed</strong><span>${state.transactions.filter(t=>t.amount>0).reduce((a,b)=>a+b.amount,0).toLocaleString('en-IN')}</span></div><div class="insight"><strong>Active participants</strong><span>${new Set(state.reports.map(r=>r.studentId)).size}</span></div></div><button class="secondary" style="margin-top:16px" data-page="analytics">Open analytics →</button></div></div>`; }
  function adminTable(rows){ return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Report ID</th><th>Category</th><th>Location</th><th>Date</th><th>Priority</th><th>Status</th><th>Department</th></tr></thead><tbody>${rows.map(r=>`<tr class="row-click" data-report-id="${r.id}"><td><strong>${esc(r.id)}</strong></td><td>${esc(r.category)}</td><td>${esc(r.locationName)}</td><td>${fmtDate(r.date)}</td><td>${r.priority}</td><td>${statusBadge(r.status)}</td><td>${esc(r.department)}</td></tr>`).join('')}</tbody></table></div>`; }
  function adminReportsPage(){ return `<div class="section-head"><div><div class="eyebrow">Maintenance queue</div><h2>Reports</h2><p>Filter by category, location, priority and status.</p></div><div class="points-pill">${state.reports.length} tickets</div></div><div class="card table-card"><div style="padding:18px 18px 4px"><div class="filter-row"><select id="fCat"><option value="">All Categories</option>${['Water Leak','Waste Management','Electricity','Infrastructure','Cleanliness','Other'].map(x=>`<option>${x}</option>`).join('')}</select><select id="fLoc"><option value="">All Locations</option>${[...new Set(state.reports.map(r=>r.locationName))].map(x=>`<option>${x}</option>`).join('')}</select><select id="fPri"><option value="">All Priorities</option>${['Low','Medium','High','Critical'].map(x=>`<option>${x}</option>`).join('')}</select><select id="fStatus"><option value="">All Statuses</option>${['Submitted','Under Review','Assigned','In Progress','Resolved','Rejected','Duplicate'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div id="adminTableMount">${adminTable(state.reports)}</div></div>`; }
  function filterAdmin(){ const vals=['fCat','fLoc','fPri','fStatus'].map(id=>document.getElementById(id)?.value||''); const [c,l,p,s]=vals; const rows=state.reports.filter(r=>(!c||r.category===c)&&(!l||r.locationName===l)&&(!p||r.priority===p)&&(!s||r.status===s));document.getElementById('adminTableMount').innerHTML=adminTable(rows);wireReportRows(); }
  function adminMapPage(){ const ms=state.reports.map((r,i)=>{const x=15+(i*17)%70,y=28+(i*23)%55;return `<div class="marker ${r.status==='Resolved'?'':'red'}" style="left:${x}%;top:${y}%" title="${esc(r.category)} · ${esc(r.locationName)}" data-report-id="${r.id}"></div>`}).join(''); return `<div class="section-head"><div><div class="eyebrow">Spatial view</div><h2>Campus Map</h2><p>Reported issues plotted by approximate location. Click a marker to open the ticket.</p></div></div><div class="grid grid-2"><div class="card form-card"><div class="map-canvas" style="min-height:520px">${ms}<div class="map-label" style="left:14%;top:13%">Main Academic Block</div><div class="map-label" style="right:14%;top:28%">Canteen</div><div class="map-label" style="left:15%;bottom:18%">Computer Lab</div><div class="map-label" style="right:12%;bottom:14%">Hostel Block</div><div class="map-label" style="left:44%;bottom:11%">Library</div></div></div><div class="card form-card"><h3>Map legend</h3><div class="grid" style="gap:10px"><div class="insight"><strong>Green marker</strong><span>Resolved report</span></div><div class="insight"><strong>Red marker</strong><span>Open / unresolved report</span></div><div class="insight"><strong>Location data</strong><span>Approximate latitude/longitude stored with each report.</span></div></div><div style="margin-top:16px"><h3 style="margin-bottom:10px">Problem areas</h3>${locationCounts().slice(0,5).map(x=>`<div class="transaction"><div class="tx-main"><strong>${esc(x[0])}</strong><span>${x[1]} reports</span></div><div>${x[2]}% unresolved</div></div>`).join('')}</div></div></div>`; }
  function analyticsPage(){ setTimeout(drawCharts,0); return `<div class="section-head"><div><div class="eyebrow">Preventive maintenance</div><h2>Analytics</h2><p>Use recurring issue patterns to move from reactive maintenance to prevention.</p></div></div><div class="grid grid-4"><div class="card stat-card"><div class="stat-top">Total reports</div><div class="stat-number">${state.reports.length}</div></div><div class="card stat-card"><div class="stat-top">Resolved</div><div class="stat-number">${state.reports.filter(r=>r.status==='Resolved').length}</div></div><div class="card stat-card"><div class="stat-top">Avg. resolution</div><div class="stat-number">${avgResolutionHours()}h</div></div><div class="card stat-card"><div class="stat-top">Eco Points distributed</div><div class="stat-number">${state.transactions.filter(t=>t.amount>0).reduce((a,b)=>a+b.amount,0).toLocaleString('en-IN')}</div></div></div><div class="grid grid-2" style="margin-top:18px"><div class="card analytics-card"><h3>Reports by category</h3><div class="chart-box"><canvas id="catChart"></canvas></div></div><div class="card analytics-card"><h3>Reports by month</h3><div class="chart-box"><canvas id="monthChart"></canvas></div></div><div class="card analytics-card"><h3>Resolved vs unresolved</h3><div class="chart-box"><canvas id="statusChart"></canvas></div></div><div class="card analytics-card"><h3>Key insights</h3><div class="grid"><div class="insight"><strong>Most reported category</strong><span>${mostCommon(state.reports.map(r=>r.category))}</span></div><div class="insight"><strong>Most problematic location</strong><span>${mostCommon(state.reports.map(r=>r.locationName))}</span></div><div class="insight"><strong>Active student participants</strong><span>${new Set(state.reports.map(r=>r.studentId)).size}</span></div></div></div></div>`; }
  function drawCharts(){ Object.values(charts).forEach(c=>c?.destroy()); const byCat=counts(state.reports.map(r=>r.category)); const byMonth=counts(state.reports.map(r=>r.date.slice(0,7))); const resolved=state.reports.filter(r=>r.status==='Resolved').length, unresolved=state.reports.length-resolved; charts.cat=new Chart(document.getElementById('catChart'),{type:'doughnut',data:{labels:Object.keys(byCat),datasets:[{data:Object.values(byCat)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}}); charts.month=new Chart(document.getElementById('monthChart'),{type:'bar',data:{labels:Object.keys(byMonth),datasets:[{label:'Reports',data:Object.values(byMonth),borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}}},plugins:{legend:{display:false}}}}); charts.status=new Chart(document.getElementById('statusChart'),{type:'doughnut',data:{labels:['Resolved','Unresolved'],datasets:[{data:[resolved,unresolved]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}}); }
  function rewardsAdminPage(){ return `<div class="section-head"><div><div class="eyebrow">Admin controls</div><h2>Rewards Management</h2><p>Modify reward values and availability for students.</p></div><button class="primary" id="addReward">＋ Add Reward</button></div><div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Reward</th><th>Cost</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.rewards.map(r=>`<tr><td><strong>${r.icon} ${esc(r.name)}</strong></td><td>${r.cost} pts</td><td>${r.active?'<span class="badge b-green">Active</span>':'<span class="badge b-gray">Hidden</span>'}</td><td><button class="secondary" data-edit-reward="${r.id}">Edit</button> <button class="ghost" data-toggle-reward="${r.id}">${r.active?'Hide':'Activate'}</button></td></tr>`).join('')}</tbody></table></div></div>`; }
  function usersPage(){ return `<div class="section-head"><div><div class="eyebrow">People</div><h2>Users</h2><p>Prototype directory of students and maintenance staff.</p></div></div><div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Role</th><th>College Email</th><th>ID</th><th>Eco Points</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td>${u.role==='student'?'<span class="badge b-green">Student</span>':'<span class="badge b-blue">Admin</span>'}</td><td>${esc(u.email)}</td><td>${esc(u.studentId)}</td><td>${u.points.toLocaleString('en-IN')}</td></tr>`).join('')}</tbody></table></div></div>`; }
  function settingsPage(){ return `<div class="section-head"><div><div class="eyebrow">Prototype settings</div><h2>Settings</h2><p>Controls kept local for the demonstration prototype.</p></div></div><div class="grid grid-2"><div class="card profile-card"><h3>Authentication</h3><p style="color:var(--muted);font-size:13px">Mock authentication is enabled. Connect this UI to your college identity provider or backend when deploying.</p><button class="danger" id="resetDemo">Reset Demo Data</button></div><div class="card profile-card"><h3>Routing logic</h3>${Object.entries(deptMap).map(([a,b])=>`<div class="checklist" style="margin-bottom:9px"><div><span>${a}</span><strong>${b}</strong></div></div>`).join('')}</div></div>`; }

  function wireReportRows(){ document.querySelectorAll('[data-report-id]').forEach(el=>{el.onclick=(e)=>{if(el.dataset.reportId)openReport(el.dataset.reportId);};}); }
  function openReport(id){ const r=state.reports.find(x=>x.id===id); if(!r)return; const isAdmin=currentUser.role==='admin'; showModal(`<div class="modal-head"><div><div class="eyebrow">Ticket ${esc(r.id)}</div><h3>${esc(r.category)} · ${esc(r.locationName)}</h3></div><button class="close" id="closeBtn">×</button></div><div class="detail-grid"><div>${r.image?`<img class="detail-image" src="${r.image}" alt="Issue photo">`:`<div class="detail-image" style="height:240px;display:grid;place-items:center;font-size:68px">${catIcon(r.category)}</div>`}<div class="card" style="padding:16px;margin-top:13px"><strong>Description</strong><p style="font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:0">${esc(r.description)}</p></div></div><div class="card" style="padding:16px"><div class="detail-list"><div class="detail-item"><span>Status</span><strong>${statusBadge(r.status)}</strong></div><div class="detail-item"><span>Priority</span><strong>${esc(r.priority)}</strong></div><div class="detail-item"><span>Assigned Department</span><strong>${esc(r.department)}</strong></div><div class="detail-item"><span>Location</span><strong>${esc(r.locationName)}</strong></div><div class="detail-item"><span>Approx. coordinates</span><strong>${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</strong></div><div class="detail-item"><span>Reported</span><strong>${fmtDate(r.date)}</strong></div><div class="detail-item"><span>Eco Points</span><strong>${r.points?`+${r.points}`:'Pending verification'}</strong></div></div><div class="map-preview" style="margin-top:15px;min-height:180px"><div class="marker" style="left:52%;top:45%"></div><div class="map-label" style="left:13%;top:13%">Approximate location</div></div>${isAdmin?adminControls(r):`<div style="margin-top:16px"><h4 style="margin:0 0 10px">Status timeline</h4><div class="timeline">${r.history.map(h=>`<div class="step"><span class="step-dot"></span><div class="step-body"><strong>${esc(h[0])}</strong><span>${esc(h[1])}</span></div></div>`).join('')}</div></div>`}</div></div>`); document.getElementById('closeBtn').onclick=closeModal; if(isAdmin)wireAdminControls(r); }
  function adminControls(r){ return `<div style="margin-top:18px"><h4 style="margin:0 0 10px">Maintenance actions</h4><div class="field"><label>Department</label><select id="editDept">${Object.values(deptMap).map(x=>`<option ${x===r.department?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="grid grid-2"><div class="field"><label>Priority</label><select id="editPriority">${['Low','Medium','High','Critical'].map(x=>`<option ${x===r.priority?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="editStatus">${['Submitted','Under Review','Assigned','In Progress','Resolved','Rejected','Duplicate'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid grid-2"><button class="secondary" id="saveTicket">Save Ticket</button><button class="primary" id="verifyTicket">Verify & Award Points</button></div><div style="font-size:11px;color:var(--muted);margin-top:9px">Verification awards 50 points for this prototype only when the report is valid; duplicate/rejected reports receive no points.</div></div>`; }
  function wireAdminControls(r){ document.getElementById('saveTicket').onclick=()=>{const nd=document.getElementById('editDept').value,np=document.getElementById('editPriority').value,ns=document.getElementById('editStatus').value; if(r.status!==ns)r.history.push([ns,new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})]); r.department=nd;r.priority=np;r.status=ns;if(ns==='Resolved'&&r.verified===false)toast('Ticket marked resolved. Verify it to award points.'); save();closeModal();render();toast(`${r.id} updated.`)}; document.getElementById('verifyTicket').onclick=()=>{if(['Rejected','Duplicate'].includes(r.status)){toast('Rejected or duplicate reports cannot earn points.');return;} if(r.verified){toast('This report has already been verified.');return;} r.verified=true;r.points=50; if(r.status!=='Resolved'){r.status='Resolved';r.history.push(['Resolved',new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})]);} const u=state.users.find(x=>x.id===r.studentId);u.points+=50;state.transactions.push({id:'t'+Date.now(),studentId:r.studentId,amount:50,label:`Verified ${r.category} Report`,date:new Date().toISOString().slice(0,10),type:'credit'});save();closeModal();render();toast(`Verified ${r.id}. +50 Eco Points awarded.`)}; }

  function mostCommon(arr){const c=counts(arr), k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return k?`${k} (${c[k]})`:'—';} function counts(arr){return arr.reduce((o,x)=>(o[x]=(o[x]||0)+1,o),{});} function locationCounts(){ const out=Object.entries(counts(state.reports.map(r=>r.locationName))).map(([k,v])=>[k,v,Math.round(state.reports.filter(r=>r.locationName===k&&!['Resolved','Rejected','Duplicate'].includes(r.status)).length/v*100)]);return out.sort((a,b)=>b[1]-a[1]); }
  function avgResolutionHours(){ const vals=state.reports.filter(r=>r.status==='Resolved').map(r=>{const s=r.history.find(h=>h[0]==='Submitted')?.[1], e=r.history.find(h=>h[0]==='Resolved')?.[1];return s&&e?Math.max(1,(new Date(e)-new Date(s))/36e5):8}); return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0; }

  function showModal(html){ document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal">${html}</div></div>`; document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal();}; }
  function closeModal(){document.getElementById('modalRoot').innerHTML='';}
  function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3000)}
  function init(){
    document.addEventListener('click',e=>{
      const theme=e.target.closest('#themeToggle');
      if(theme){toggleTheme();return;}
      const p=e.target.closest('[data-page]');
      if(p&&currentUser){currentPage=p.dataset.page;render();return;}
      const rid=e.target.closest('[data-report-id]');
      if(rid&&currentUser){openReport(rid.dataset.reportId);return;}
      const rb=e.target.closest('[data-redeem]');
      if(rb){redeem(rb.dataset.redeem);return;}
      const er=e.target.closest('[data-edit-reward]');
      if(er){editReward(er.dataset.editReward);return;}
      const tr=e.target.closest('[data-toggle-reward]');
      if(tr){const r=state.rewards.find(x=>x.id===tr.dataset.toggleReward);r.active=!r.active;save();render();toast(`${r.name} is now ${r.active?'active':'hidden'}.`);return;}
    });
    render();
  }
  function editReward(id){const r=state.rewards.find(x=>x.id===id);showModal(`<div class="modal-head"><h3>Edit Reward</h3><button class="close" id="x">×</button></div><div class="field"><label>Name</label><input id="rwName" value="${esc(r.name)}"></div><div class="field"><label>Eco Point Cost</label><input id="rwCost" type="number" min="1" value="${r.cost}"></div><div class="field"><label>Icon</label><input id="rwIcon" value="${esc(r.icon)}"></div><button class="primary full" id="saveReward">Save Reward</button>`);document.getElementById('x').onclick=closeModal;document.getElementById('saveReward').onclick=()=>{r.name=document.getElementById('rwName').value.trim()||r.name;r.cost=Math.max(1,parseInt(document.getElementById('rwCost').value||r.cost));r.icon=document.getElementById('rwIcon').value||r.icon;save();closeModal();render();toast('Reward updated.');};}
  document.addEventListener('DOMContentLoaded',()=>{init();});
  const oldShell=shell; shell=function(title,body){oldShell(title,body); if(currentUser?.role==='student'&&currentPage==='report')setTimeout(initReport,0); if(currentUser?.role==='admin'&&currentPage==='reports'){['fCat','fLoc','fPri','fStatus'].forEach(id=>document.getElementById(id)?.addEventListener('change',filterAdmin));} wireReportRows(); if(currentUser?.role==='admin'&&currentPage==='settings')document.getElementById('resetDemo')?.addEventListener('click',()=>{if(confirm('Reset all prototype data?')){state=clone(demo);save();render();toast('Demo data reset.')}}); if(currentUser?.role==='admin'&&currentPage==='rewards-admin')document.getElementById('addReward')?.addEventListener('click',()=>{state.rewards.push({id:'r'+Date.now(),name:'New Campus Reward',cost:500,icon:'🎁',active:true});save();render();toast('New reward added. Click Edit to customize it.');}); };
})();
</script>
</body>
</html>
